name: Auto Patch & Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 03:00 检查官方是否发版
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  patch-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 获取官方最新版
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --depth 1 https://github.com/Meloong-Git/PCL.git main
          git checkout FETCH_HEAD -- "最新正式版.zip"
          if (-not (Test-Path "最新正式版.zip")) { throw "未找到 最新正式版.zip" }
          Expand-Archive "最新正式版.zip" "$env:RUNNER_TEMP\pcl-official" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\pcl-official" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "压缩包内没有 exe" }
          $ver = (Get-Item $exe.FullName).VersionInfo.FileVersion
          "PCL_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV
          "OFFICIAL_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "官方版本: $ver"

      - name: 已有该版本 Release 则跳过
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:PCL_VERSION" --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "已存在 v$env:PCL_VERSION 的 Release，跳过"
            "SKIP=true" | Out-File -Append $env:GITHUB_ENV
          } else {
            "SKIP=false" | Out-File -Append $env:GITHUB_ENV
          }
          exit 0

      - name: 构建补丁工具
        if: env.SKIP == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build McRestorePatcher/McRestorePatcher.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "补丁器构建失败" }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "找不到 csc.exe，无法编译 GUI" }
          & $csc /nologo /target:winexe /out:"GUI\PCLDownloadRecovery.GUI.exe" `
            /reference:System.dll /reference:System.Core.dll `
            /reference:System.Windows.Forms.dll /reference:System.Drawing.dll `
            "GUI\PatchTool.cs"
          if ($LASTEXITCODE -ne 0) { throw "GUI 编译失败" }

      - name: 打补丁并自检
        if: env.SKIP == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = "$env:RUNNER_TEMP\pcl-fixed"
          New-Item -ItemType Directory $outDir -Force | Out-Null
          $out = Join-Path $outDir "Plain Craft Launcher 2.exe"
          $patcher = "McRestorePatcher\bin\Release\McRestorePatcher.exe"
          & $patcher "$env:OFFICIAL_EXE" $out
          if ($LASTEXITCODE -ne 0) { throw "补丁失败（退码 $LASTEXITCODE），该版本需要人工适配" }
          $ver = (Get-Item $out).VersionInfo.FileVersion
          if ($ver -ne $env:PCL_VERSION) { throw "版本号不一致: $ver" }
          # 自检：对产物再跑一次，必须全部 SKIP 且退码 0
          & $patcher $out "$env:RUNNER_TEMP\selfcheck.exe"
          if ($LASTEXITCODE -ne 0) { throw "自检失败，产物可能不可用" }
          "PATCHED_EXE=$out" | Out-File -Append $env:GITHUB_ENV

      - name: 打包修改包与工具
        if: env.SKIP == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1) 修改包：修好的启动器 + 关闭更新提示的 Setup.ini
          $pkg = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory "$pkg\PCL" -Force | Out-Null
          Copy-Item $env:PATCHED_EXE "$pkg\Plain Craft Launcher 2.exe"
          "LaunchFolderSelect:$.minecraft\`r`nSystemSystemUpdate:3" | Set-Content -Encoding ASCII "$pkg\PCL\Setup.ini"
          $pkgReadme = @"
          PCL $env:PCL_VERSION 下载恢复版（修改包）
          ========================================
          版本：$env:PCL_VERSION（官方正式版 + 下载恢复补丁）
          配置：已关闭更新提示（PCL\Setup.ini 中 SystemSystemUpdate:3）

          使用方法：解压到任意文件夹，双击 "Plain Craft Launcher 2.exe"。
          "@
          $pkgReadme | Set-Content -Encoding UTF8 "$pkg\修改包说明.txt"
          $zip = "$env:RUNNER_TEMP\PCL_$($env:PCL_VERSION)_MCfix.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -Force
          "PKG_ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

          # 2) 工具：GUI + 命令行补丁器（.NET Framework 4.8，系统自带，无需安装运行时）
          $tool = "$env:RUNNER_TEMP\tool"
          New-Item -ItemType Directory $tool -Force | Out-Null
          Copy-Item "McRestorePatcher\bin\Release\McRestorePatcher.exe","McRestorePatcher\bin\Release\dnlib.dll" $tool
          Copy-Item "GUI\PCLDownloadRecovery.GUI.exe" $tool
          $toolReadme = @"
          PCL 下载恢复补丁工具
          ================================
          这个工具只读取你本机的官方 PCL 并生成一个新文件，不包含、也不分发 PCL 的代码或二进制。
          需要 .NET Framework 4.8（Windows 10/11 系统自带）。

          【图形界面】
          1. 双击 PCLDownloadRecovery.GUI.exe
          2. 把官方 PCL 的 exe 拖进窗口，或点「浏览…」选择
          3. 点「开始补丁」，会在原文件旁生成 "原文件名 (dl-restore).exe"
          4. 用生成的文件替换原 PCL（替换前先备份）

          【命令行】
            McRestorePatcher.exe "<官方 exe>" "<输出 exe>"
          也可以不带参数运行，按提示把 PCL 的 exe 拖进窗口。

          注意：补丁失败会返回非 0 且不写出文件；修改过的 exe 可能被杀软误报。
          "@
          $toolReadme | Set-Content -Encoding UTF8 "$tool\使用说明.txt"
          $toolZip = "$env:RUNNER_TEMP\PCLDownloadRecovery-Tool.zip"
          Compress-Archive -Path "$tool\*" -DestinationPath $toolZip -Force
          "TOOL_ZIP=$toolZip" | Out-File -Append $env:GITHUB_ENV

      - name: 发布 Release
        if: env.SKIP == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @"
          两种文件，按需要选：

          ## 修改包（开箱即用）

          已经打好补丁的官方 PCL $env:PCL_VERSION 正式版，适合只想直接用的。

          - ``PCL_$($env:PCL_VERSION)_MCfix.zip``：便携包，解压即用（内含 ``PCL\Setup.ini``，已关闭更新提示）
          - ``Plain Craft Launcher 2.exe``：单个 exe，替换你现有的 PCL 即可（替换前先备份）

          ## 工具（自行打补丁）

          ``PCLDownloadRecovery-Tool.zip``，适合已有官方 PCL、想自己动手的。

          - 免安装：.NET Framework 4.8 系统自带，不用装 .NET 8
          - 双击 ``PCLDownloadRecovery.GUI.exe``，把 PCL 的 exe 拖进窗口，点「开始补丁」
          - 在原文件旁生成 ``原文件名 (dl-restore).exe``，不会改动原文件
          - 也可以命令行：``McRestorePatcher.exe "<官方 exe>" "<输出 exe>"``

          ## 说明

          - 修改包 = 官方 $env:PCL_VERSION + 恢复补丁，除补丁点外与原版一致。
          - 工具只读取你本机的 PCL 副本并生成新文件，不包含、也不分发 PCL 的代码或二进制。
          - 恢复的入口：下载页「原版」/「游戏资源」、整合包安装、修改页「MC 版本」、资源页「安装整合包」、启动页下载状态、更新提示弹窗按钮。
          - 修改过的 exe 可能被杀软误报；更新提示已在包里关闭，避免被官方更新覆盖。

          ## 免责

          非官方产物，与 PCL 开发者无关，PCL 版权归原作者所有。请在遵守当地法律法规的前提下自行决定是否使用，风险自负；建议支持官方版本。
          "@
          $notes | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\notes.md"
          gh release create "v$env:PCL_VERSION" `
            "$env:PATCHED_EXE" `
            "$env:PKG_ZIP" `
            "$env:TOOL_ZIP" `
            --repo $env:GITHUB_REPOSITORY `
            --title "PCL $env:PCL_VERSION 下载恢复版" `
            --notes-file "$env:RUNNER_TEMP\notes.md"

      - name: 失败时开 Issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = "自动流水线对 PCL $env:PCL_VERSION 打补丁失败，需要人工适配补丁工具。`n`n运行记录：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh issue create --repo $env:GITHUB_REPOSITORY --title "补丁失败：PCL $env:PCL_VERSION" --body $body 2>$null | Out-Null
          exit 0
